<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLIXORA - Movies Worth Exploring</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="index.html">
      <svg class="brand-icon" viewBox="0 0 38 38" aria-hidden="true">
        <rect class="body" x="2" y="4" width="34" height="30" rx="6"></rect>
        <path class="clapper" d="M2 12h34M6 4l4 8M16 4l4 8M26 4l4 8"></path>
        <path class="stripe" d="M6 16h26v6H6z"></path>
        <polygon class="play" points="16,15 25,19 16,23"></polygon>
      </svg>
      <span class="brand-word">FLIXORA</span>
    </a>
    <a class="header-home" href="index.html">Explore movies <span>↓</span></a>
  </header>
  
      <nav class="nav-links">
        <a href="index.html" class="active">Explore movies ↓</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="featured-section" aria-label="Featured movies">
      <div class="featured-header">
        <div>
          <span class="section-kicker">WELCOME TO FLIXORA</span>
          <h2>Movies worth exploring</h2>
        </div>
        <p class="muted">Discover your next favourite.</p>
        <div class="featured-controls">
          <button id="featured-prev" class="featured-control" type="button" aria-label="Previous featured movies">‹</button>
          <button id="featured-next" class="featured-control" type="button" aria-label="Next featured movies">›</button>
        </div>
      </div>
      <div id="featured-track" class="featured-track">
        <p class="featured-empty">Loading featured movies...</p>
      </div>
    </section>

    <!-- ক্যাটাগরি লিস্ট (বড় হেডার বাদ দিয়ে শুধু চিপসগুলো রাখা হয়েছে) -->
    <div id="category-list" class="category-list">
      <button class="category-chip active" type="button" data-category="all">All</button>
    </div>

    <!-- মুভি সেকশন (বড় হেডার লেখা বাদ দিয়ে শুধু সার্চ ও গ্রিড) -->
    <section id="latest" class="movies-section">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px;">
        <span id="count" class="count-label"></span>
      </div>
      <label class="search-wrap">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="search" class="search" type="search" placeholder="Search movies or categories…" aria-label="Search movies">
      </label>
      <div id="movie-grid" class="grid">
        <p class="muted">Loading movies…</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; FLIXORA. All rights reserved.</p>
    </div>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
