<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLIXORA - Movies Worth Exploring</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="index.html">
      <svg class="brand-icon" viewBox="0 0 38 38" aria-hidden="true">
        <rect class="body" x="2" y="4" width="34" height="30" rx="6"></rect>
        <path class="clapper" d="M2 12h34M6 4l4 8M16 4l4 8M26 4l4 8"></path>
        <path class="stripe" d="M6 16h26v6H6z"></path>
        <polygon class="play" points="16,15 25,19 16,23"></polygon>
      </svg>
      <span class="brand-word">FLIXORA</span>
    </a>
    <a class="header-home" href="index.html">Explore movies <span>↓</span></a>
  </header>

  <main class="container">
    <section class="featured-section" aria-label="Featured movies">
      <div class="featured-heading">
        <div>
          <p style="margin:0 0 2px; color:var(--accent); font-size:11px; font-weight:800; letter-spacing:1px;">WELCOME TO FLIXORA</p>
          <h1>Movies worth exploring</h1>
        </div>
        <p>Discover your next favourite.</p>
        <div class="slider-controls">
          <button id="featured-prev" class="slider-arrow" type="button" aria-label="Previous featured movies">‹</button>
          <button id="featured-next" class="slider-arrow" type="button" aria-label="Next featured movies">›</button>
        </div>
      </div>
      <div id="featured-track" class="featured-track">
        <p class="featured-empty">Loading featured movies...</p>
      </div>
    </section>

    <!-- ক্যাটাগরি লিস্ট (অপ্রয়োজনীয় হেডার বাদ দেওয়া হয়েছে) -->
    <div class="browse-section">
      <div id="category-list" class="category-list">
        <button class="category-chip active" type="button" data-category="all">All</button>
      </div>
    </div>

    <!-- মুভি সেকশন (অপ্রয়োজনীয় FRESH PICKS লেখা বাদ দিয়ে সরাসরি গ্রিড) -->
    <section id="latest" class="movies-section">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 11px;">
        <span id="count" class="count-label"></span>
      </div>
      <label class="search-wrap">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="search" class="search" type="search" placeholder="Search movies or categories…" aria-label="Search movies">
      </label>
      <div id="movie-grid" class="grid">
        <p class="muted">Loading movies…</p>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; FLIXORA. All rights reserved.</p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
