<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080910">
  <title>FLIXORA — Movies</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="index.html" aria-label="FLIXORA Home">
      <svg class="brand-icon" viewBox="0 0 48 48" aria-hidden="true">
        <path class="clapper" d="M8 13.5 36.5 6l4 10.5L12 24z"/>
        <path class="body" d="M10 21h29a3 3 0 0 1 3 3v16a3 3 0 0 1-3 3H10a3 3 0 0 1-3-3V24a3 3 0 0 1 3-3Z"/>
        <path class="play" d="m21 27 11 6-11 6z"/>
        <path class="stripe" d="m15 11 5-1.3 4 10.5-5 1.3zm12-3.2 5-1.3 4 10.5-5 1.3z"/>
      </svg>
      <span class="brand-word">FLIXORA</span>
    </a>
    <a class="header-home" href="#latest">Explore movies <span aria-hidden="true">↓</span></a>
  </header>

  <main class="wrap">
    <section class="featured-section" id="featured" aria-label="Featured movies">
      <div class="featured-heading">
        <div>
          <span class="section-kicker">WELCOME TO FLIXORA</span>
          <h1>Movies worth exploring</h1>
          <p>Discover your next favourite.</p>
        </div>
        <div class="slider-controls" aria-label="Featured movie controls">
          <button class="slider-arrow" id="featured-prev" type="button" aria-label="Scroll featured movies left">‹</button>
          <button class="slider-arrow" id="featured-next" type="button" aria-label="Scroll featured movies right">›</button>
        </div>
      </div>
      <div class="featured-track" id="featured-track" tabindex="0" aria-label="Scroll through featured movie posters">
        <p class="featured-empty">Your movie collection will appear here.</p>
      </div>
    </section>

    <section class="browse-section" aria-label="Browse categories">
      <div class="section-heading">
        <div><span class="section-kicker">FIND YOUR MOOD</span><h2>Browse categories</h2></div>
      </div>
      <div id="category-list" class="category-list">
        <button class="category-chip active" type="button" data-category="all">All</button>
      </div>
    </section>

    <section id="latest" class="movies-section">
      <div class="section-heading">
        <div><span class="section-kicker">FRESH PICKS</span><h2>Latest movies</h2></div>
        <span id="count" class="count-label"></span>
      </div>
      <label class="search-wrap">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="search" class="search" type="search" placeholder="Search movies or categories…" aria-label="Search movies">
      </label>
      <div id="movie-grid" class="grid">
        <p class="muted">Loading movies…</p>
      </div>
    </section>
  </main>

  <footer><span class="footer-brand">FLIXORA</span><span>Only use links to content you own or are authorized to share.</span></footer>
  <script type="module" src="app.js"></script>
</body>
</html>
